<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传智教育EduRAG智慧问答系统</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 marked.js 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #3b82f6; /* 主要颜色：明亮蓝 */
            --primary-light: #60a5fa; /* 主要亮色 */
            --primary-dark: #2563eb; /* 主要暗色 */
            --secondary-color: #64748b; /* 次要颜色 */
            --accent-color: #38bdf8; /* 强调颜色：天空青 */
            --bg-color: rgba(255, 255, 255, 0.55); /* 玻璃面板背景 */
            --panel-solid: #eff6ff; /* 实色浅蓝（下拉框等不透明控件） */
            --text-color: #1e3a5f; /* 文本颜色：深海蓝 */
            --border-color: rgba(147, 197, 253, 0.6); /* 边框颜色：半透明蓝 */
            --hover-color: rgba(191, 219, 254, 0.5); /* 悬停颜色 */
            --glass-border: rgba(255, 255, 255, 0.65); /* 玻璃高光边框 */
            --glass-blur: blur(16px); /* 玻璃模糊度 */
            --card-shadow: 0 8px 24px rgba(37, 99, 235, 0.15); /* 卡片阴影 */
            --transition: all 0.3s ease; /* 过渡效果 */
        }

        * {
            box-sizing: border-box; /* 盒模型 */
            margin: 0; /* 外边距 */
            padding: 0; /* 内边距 */
        }

        html, body {
            height: 100%; /* 高度100% */
            overflow: hidden; /* 禁止页面滚动，固定对话窗口尺寸 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* 字体族 */
            line-height: 1.6; /* 行高 */
            color: var(--text-color); /* 文本颜色 */
            /* 动漫感蓝色渐变天空背景 */
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 45%, #dbeafe 100%);
            display: flex; /* 弹性布局 */
            flex-direction: column; /* 垂直排列 */
            height: 100vh; /* 高度固定为视口 */
            transition: var(--transition); /* 过渡效果 */
        }

        /* 动漫风格的漂浮光斑装饰 */
        body::before, body::after {
            content: ''; /* 内容为空 */
            position: fixed; /* 固定定位 */
            border-radius: 50%; /* 圆形 */
            filter: blur(60px); /* 大模糊 */
            z-index: 0; /* 位于内容之下 */
            pointer-events: none; /* 不阻挡交互 */
        }

        body::before {
            width: 420px; /* 宽度 */
            height: 420px; /* 高度 */
            background: rgba(96, 165, 250, 0.45); /* 蓝色光斑 */
            top: -120px; /* 顶部偏移 */
            right: -100px; /* 右侧偏移 */
            animation: floatBlob 12s ease-in-out infinite; /* 漂浮动画 */
        }

        body::after {
            width: 360px; /* 宽度 */
            height: 360px; /* 高度 */
            background: rgba(56, 189, 248, 0.35); /* 青色光斑 */
            bottom: -120px; /* 底部偏移 */
            left: -80px; /* 左侧偏移 */
            animation: floatBlob 15s ease-in-out infinite reverse; /* 反向漂浮 */
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.08); }
        }

        /* 深色模式支持 */
        body.dark-mode {
            --primary-color: #60a5fa; /* 主要颜色 */
            --primary-light: #93c5fd; /* 主要亮色 */
            --primary-dark: #3b82f6; /* 主要暗色 */
            --secondary-color: #94a3b8; /* 次要颜色 */
            --bg-color: rgba(30, 58, 138, 0.35); /* 玻璃面板背景 */
            --panel-solid: #1e3a5f; /* 实色深蓝 */
            --text-color: #e0f2fe; /* 文本颜色 */
            --border-color: rgba(148, 163, 184, 0.35); /* 边框颜色 */
            --hover-color: rgba(59, 130, 246, 0.25); /* 悬停颜色 */
            --glass-border: rgba(255, 255, 255, 0.25); /* 玻璃高光边框 */
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); /* 卡片阴影 */
            background: linear-gradient(135deg, #0f2447 0%, #1e3a8a 50%, #172554 100%); /* 深蓝夜空 */
        }

        header {
            background: rgba(255, 255, 255, 0.3); /* 玻璃背景 */
            backdrop-filter: var(--glass-blur); /* 背景模糊 */
            -webkit-backdrop-filter: var(--glass-blur); /* Safari 兼容 */
            border-bottom: 1px solid var(--glass-border); /* 高光下边框 */
            color: var(--primary-dark); /* 文本颜色 */
            padding: 0.75rem 1rem; /* 内边距 */
            text-align: center; /* 文本居中 */
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.12); /* 阴影 */
            position: relative; /* 相对定位 */
            z-index: 2; /* 位于光斑之上 */
            flex-shrink: 0; /* 不被压缩，保证对话区高度稳定 */
        }

        body.dark-mode header {
            color: #bfdbfe; /* 深色模式下标题为浅蓝 */
        }

        header h1 {
            font-size: 1.35rem; /* 标题大小 */
            letter-spacing: 2px; /* 字间距 */
            text-shadow: 0 2px 8px rgba(59, 130, 246, 0.3); /* 蓝色光晕 */
        }

        /* 深色模式切换按钮 */
        .theme-toggle {
            position: absolute; /* 绝对定位 */
            right: 1rem; /* 右1rem */
            top: 50%; /* 顶部50% */
            transform: translateY(-50%); /* Y轴居中 */
            background: rgba(255, 255, 255, 0.35); /* 玻璃背景 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            border-radius: 50%; /* 圆形按钮 */
            color: var(--primary-dark); /* 颜色 */
            width: 40px; /* 宽度 */
            height: 40px; /* 高度 */
            font-size: 1.1rem; /* 字体大小 */
            cursor: pointer; /* 鼠标指针 */
            transition: var(--transition); /* 过渡效果 */
        }

        .theme-toggle:hover {
            transform: translateY(-50%) scale(1.1); /* 悬停放大 */
            box-shadow: 0 0 16px rgba(96, 165, 250, 0.6); /* 蓝色发光 */
        }

        .container {
            margin: 0 auto; /* 居中 */
            width: 100%; /* 宽度100% */
            max-width: 1400px; /* 最大宽度 */
            padding: 1rem; /* 内边距 */
            display: flex; /* 弹性布局 */
            flex: 1; /* 占满剩余空间 */
            flex-direction: column; /* 垂直排列 */
            min-height: 0; /* 允许子元素收缩 */
            position: relative; /* 相对定位 */
            z-index: 1; /* 位于光斑之上 */
        }

        /* 对话窗口：高度固定，不随内容变化 */
        .chat-container {
            display: flex; /* 弹性布局 */
            flex: 1; /* 占满剩余空间 */
            min-height: 0; /* 允许收缩 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            border-radius: 20px; /* 大圆角 */
            overflow: hidden; /* 溢出隐藏 */
            background-color: var(--bg-color); /* 玻璃背景 */
            backdrop-filter: var(--glass-blur); /* 背景模糊 */
            -webkit-backdrop-filter: var(--glass-blur); /* Safari 兼容 */
            box-shadow: var(--card-shadow); /* 卡片阴影 */
            transition: var(--transition); /* 过渡效果 */
        }

        .sidebar {
            width: 280px; /* 宽度固定 */
            flex-shrink: 0; /* 宽度不被压缩 */
            background: rgba(255, 255, 255, 0.2); /* 轻玻璃背景 */
            padding: 1rem; /* 内边距 */
            border-right: 1px solid var(--glass-border); /* 高光右边框 */
            display: flex; /* 弹性布局 */
            flex-direction: column; /* 垂直排列 */
            transition: var(--transition); /* 过渡效果 */
        }

        body.dark-mode .sidebar {
            background: rgba(15, 36, 71, 0.35); /* 深色玻璃 */
        }

        /* 搜索框样式 */
        .search-box {
            padding: 0.55rem 0.75rem; /* 内边距 */
            border-radius: 12px; /* 圆角 */
            border: 1px solid var(--border-color); /* 边框 */
            background-color: rgba(255, 255, 255, 0.5); /* 玻璃背景 */
            color: var(--text-color); /* 文本颜色 */
            margin-bottom: 1rem; /* 下边距 */
            transition: var(--transition); /* 过渡效果 */
        }

        body.dark-mode .search-box {
            background-color: rgba(30, 58, 95, 0.6); /* 深色玻璃 */
        }

        .search-box::placeholder {
            color: var(--secondary-color); /* 占位符颜色 */
        }

        .search-box:focus {
            outline: none; /* 无轮廓 */
            border-color: var(--primary-color); /* 边框颜色 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); /* 焦点光晕 */
        }

        .main-content {
            flex: 1; /* 占满剩余空间 */
            min-width: 0; /* 允许收缩 */
            display: flex; /* 弹性布局 */
            flex-direction: column; /* 垂直排列 */
            position: relative; /* 相对定位 */
        }

        .chat-history {
            flex: 1; /* 占满剩余空间 */
            min-height: 0; /* 允许收缩 */
            padding: 1.25rem; /* 内边距 */
            overflow-y: auto; /* 垂直滚动 */
            scroll-behavior: smooth; /* 平滑滚动 */
            background: transparent; /* 透明背景，透出玻璃 */
            transition: var(--transition); /* 过渡效果 */
        }

        .chat-input-container {
            padding: 1rem 1.25rem; /* 内边距 */
            border-top: 1px solid var(--glass-border); /* 高光上边框 */
            background: rgba(255, 255, 255, 0.25); /* 轻玻璃背景 */
            display: flex; /* 弹性布局 */
            flex-direction: column; /* 垂直排列 */
            flex-shrink: 0; /* 高度稳定 */
            transition: var(--transition); /* 过渡效果 */
        }

        body.dark-mode .chat-input-container {
            background: rgba(15, 36, 71, 0.35); /* 深色玻璃 */
        }

        .source-filter {
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            margin-bottom: 0.5rem; /* 下边距 */
            color: var(--text-color); /* 文本颜色 */
            font-size: 0.9rem; /* 字体大小 */
        }

        .source-filter select {
            margin-left: 0.5rem; /* 左边距 */
            padding: 0.35rem 0.75rem; /* 内边距 */
            border-radius: 10px; /* 圆角 */
            border: 1px solid var(--border-color); /* 边框 */
            background-color: var(--panel-solid); /* 不透明背景（保证下拉可读） */
            color: var(--text-color); /* 文本颜色 */
            cursor: pointer; /* 鼠标指针 */
            transition: var(--transition); /* 过渡效果 */
        }

        .source-filter select:focus {
            outline: none; /* 无轮廓 */
            border-color: var(--primary-color); /* 边框颜色 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); /* 焦点光晕 */
        }

        .input-group {
            display: flex; /* 弹性布局 */
            position: relative; /* 相对定位 */
        }

        .chat-input {
            flex: 1; /* 占满剩余空间 */
            padding: 0.75rem 1rem; /* 内边距 */
            border: 1px solid var(--border-color); /* 边框 */
            border-radius: 14px 0 0 14px; /* 圆角 */
            font-size: 1rem; /* 字体大小 */
            font-family: inherit; /* 继承字体 */
            resize: none; /* 不可调整大小 */
            height: 45px; /* 高度固定 */
            max-height: 150px; /* 最大高度 */
            overflow-y: auto; /* 垂直滚动 */
            background-color: rgba(255, 255, 255, 0.6); /* 玻璃背景 */
            color: var(--text-color); /* 文本颜色 */
            transition: var(--transition); /* 过渡效果 */
        }

        body.dark-mode .chat-input {
            background-color: rgba(30, 58, 95, 0.7); /* 深色玻璃 */
        }

        .chat-input::placeholder {
            color: var(--secondary-color); /* 占位符颜色 */
        }

        .chat-input:focus {
            outline: none; /* 无轮廓 */
            border-color: var(--primary-color); /* 边框颜色 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); /* 焦点光晕 */
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); /* 蓝色渐变 */
            color: white; /* 文本颜色 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            padding: 0 1.4rem; /* 内边距 */
            border-radius: 0 14px 14px 0; /* 圆角 */
            cursor: pointer; /* 鼠标指针 */
            font-size: 1rem; /* 字体大小 */
            transition: var(--transition); /* 过渡效果 */
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            justify-content: center; /* 水平居中 */
            gap: 0.5rem; /* 间距 */
        }

        .send-btn:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color)); /* 悬停渐变 */
            transform: translateY(-2px); /* 上移 */
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45); /* 蓝色发光阴影 */
        }

        .send-btn:active {
            transform: translateY(0); /* 恢复 */
            box-shadow: none; /* 无阴影 */
        }

        .send-btn:disabled {
            background: var(--secondary-color); /* 禁用背景 */
            cursor: not-allowed; /* 禁用指针 */
        }

        .message {
            margin-bottom: 1rem; /* 下边距 */
            display: flex; /* 弹性布局 */
            flex-direction: column; /* 垂直排列 */
            animation: fadeIn 0.3s ease; /* 淡入动画 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            margin-bottom: 0.25rem; /* 下边距 */
            font-size: 0.85rem; /* 字体大小 */
            color: var(--secondary-color); /* 文本颜色 */
        }

        .avatar {
            width: 32px; /* 宽度 */
            height: 32px; /* 高度 */
            border-radius: 50%; /* 圆形 */
            margin-right: 0.5rem; /* 右边距 */
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); /* 蓝青渐变 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35); /* 发光 */
            color: white; /* 文本颜色 */
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            justify-content: center; /* 水平居中 */
            font-weight: bold; /* 粗体 */
        }

        .message-content {
            padding: 0.75rem 1rem; /* 内边距 */
            border-radius: 16px; /* 大圆角气泡 */
            max-width: 80%; /* 最大宽度 */
            word-break: break-word; /* 单词换行 */
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.12); /* 蓝色柔和阴影 */
            position: relative; /* 相对定位 */
        }

        .user-message {
            align-self: flex-end; /* 右对齐 */
        }

        .user-message .message-content {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light)); /* 蓝色渐变气泡 */
            border: 1px solid rgba(255, 255, 255, 0.4); /* 高光边框 */
            color: white; /* 文本颜色 */
            align-self: flex-end; /* 右对齐 */
            border-top-right-radius: 4px; /* 右上小圆角，形成气泡尖角 */
        }

        .system-message {
            align-self: flex-start; /* 左对齐 */
        }

        .system-message .message-content {
            background: rgba(255, 255, 255, 0.65); /* 玻璃气泡 */
            backdrop-filter: blur(8px); /* 背景模糊 */
            -webkit-backdrop-filter: blur(8px); /* Safari 兼容 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            color: var(--text-color); /* 文本颜色 */
            align-self: flex-start; /* 左对齐 */
            border-top-left-radius: 4px; /* 左上小圆角 */
        }

        body.dark-mode .system-message .message-content {
            background: rgba(30, 58, 95, 0.65); /* 深色玻璃 */
        }

        /* 代码块样式 */
        .message-content pre {
            background-color: rgba(30, 58, 95, 0.85); /* 深蓝代码底 */
            color: #e0f2fe; /* 浅蓝代码字 */
            padding: 1rem; /* 内边距 */
            border-radius: 10px; /* 圆角 */
            overflow-x: auto; /* 水平滚动 */
            margin: 0.5rem 0; /* 上下边距 */
        }

        .message-content code {
            font-family: 'Courier New', Courier, monospace; /* 字体族 */
            font-size: 0.9rem; /* 字体大小 */
        }

        .message-content pre code {
            color: #e0f2fe; /* 代码块内代码字颜色 */
        }

        .message-content :not(pre) > code {
            background: rgba(59, 130, 246, 0.15); /* 行内代码底色 */
            padding: 0.1em 0.35em; /* 内边距 */
            border-radius: 6px; /* 圆角 */
        }

        /* 图片样式 */
        .message-content img {
            max-width: 100%; /* 最大宽度 */
            border-radius: 8px; /* 圆角 */
            margin: 0.5rem 0; /* 上下边距 */
        }

        .typing-indicator {
            display: inline-block; /* 行内块 */
            align-self: flex-start; /* 左对齐 */
            padding: 0.75rem 1rem; /* 内边距 */
            background: rgba(255, 255, 255, 0.65); /* 玻璃背景 */
            backdrop-filter: blur(8px); /* 背景模糊 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            border-radius: 16px; /* 圆角 */
            border-top-left-radius: 4px; /* 左上小圆角 */
            margin-bottom: 1rem; /* 下边距 */
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.12); /* 阴影 */
        }

        .typing-indicator span {
            display: inline-block; /* 行内块 */
            width: 8px; /* 宽度 */
            height: 8px; /* 高度 */
            border-radius: 50%; /* 圆形 */
            background-color: var(--primary-light); /* 蓝色圆点 */
            margin-right: 4px; /* 右边距 */
            animation: typing 1s infinite; /* 打字动画 */
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s; /* 延迟 */
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s; /* 延迟 */
            margin-right: 0; /* 无右边距 */
        }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .session-controls {
            display: flex; /* 弹性布局 */
            justify-content: space-between; /* 两端对齐 */
            margin-bottom: 1rem; /* 下边距 */
            gap: 0.5rem; /* 间距 */
        }

        .new-session-btn, .clear-history-btn {
            background: rgba(255, 255, 255, 0.45); /* 玻璃背景 */
            backdrop-filter: blur(8px); /* 背景模糊 */
            color: var(--primary-dark); /* 文本颜色 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            padding: 0.5rem 1rem; /* 内边距 */
            border-radius: 12px; /* 圆角 */
            cursor: pointer; /* 鼠标指针 */
            font-size: 0.9rem; /* 字体大小 */
            transition: var(--transition); /* 过渡效果 */
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            justify-content: center; /* 水平居中 */
            gap: 0.3rem; /* 间距 */
            flex: 1; /* 占满剩余空间 */
        }

        body.dark-mode .new-session-btn,
        body.dark-mode .clear-history-btn {
            background: rgba(30, 58, 95, 0.6); /* 深色玻璃 */
            color: #bfdbfe; /* 浅蓝文本 */
        }

        .new-session-btn:hover, .clear-history-btn:hover {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); /* 蓝色渐变 */
            color: white; /* 悬停文本 */
            transform: translateY(-2px); /* 上移 */
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45); /* 蓝色发光 */
        }

        .new-session-btn:active, .clear-history-btn:active {
            transform: translateY(0); /* 恢复 */
            box-shadow: none; /* 无阴影 */
        }

        .session-info {
            font-size: 0.85rem; /* 字体大小 */
            color: var(--secondary-color); /* 文本颜色 */
            margin-top: 1rem; /* 上边距 */
            padding-top: 1rem; /* 上内边距 */
            border-top: 1px solid var(--glass-border); /* 高光上边框 */
            white-space: nowrap; /* 不换行 */
            overflow: hidden; /* 溢出隐藏 */
            text-overflow: ellipsis; /* 省略号 */
        }

        .history-title {
            font-weight: bold; /* 粗体 */
            margin-bottom: 1rem; /* 下边距 */
            color: var(--primary-dark); /* 文本颜色 */
            display: flex; /* 弹性布局 */
            align-items: center; /* 垂直居中 */
            gap: 0.5rem; /* 间距 */
        }

        body.dark-mode .history-title {
            color: #93c5fd; /* 深色模式下浅蓝 */
        }

        .history-list {
            flex: 1; /* 占满剩余空间 */
            min-height: 0; /* 允许收缩 */
            overflow-y: auto; /* 垂直滚动 */
        }

        .history-item {
            padding: 0.75rem; /* 内边距 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            cursor: pointer; /* 鼠标指针 */
            transition: var(--transition); /* 过渡效果 */
            border-radius: 12px; /* 圆角 */
            margin-bottom: 0.5rem; /* 下边距 */
            background: rgba(255, 255, 255, 0.45); /* 玻璃背景 */
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.1); /* 柔和阴影 */
        }

        body.dark-mode .history-item {
            background: rgba(30, 58, 95, 0.55); /* 深色玻璃 */
        }

        .history-item:hover {
            background: rgba(147, 197, 253, 0.45); /* 悬停浅蓝 */
            transform: translateX(5px); /* 右移 */
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25); /* 悬停发光 */
        }

        /* 当前激活的会话项 */
        .history-item.active {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(59, 130, 246, 0.4)); /* 蓝色渐变高亮 */
            border-color: var(--primary-color); /* 边框强调 */
        }

        .history-question {
            font-weight: bold; /* 粗体 */
            white-space: nowrap; /* 不换行 */
            overflow: hidden; /* 溢出隐藏 */
            text-overflow: ellipsis; /* 省略号 */
            color: var(--text-color); /* 文本颜色 */
        }

        .history-answer {
            color: var(--secondary-color); /* 文本颜色 */
            white-space: nowrap; /* 不换行 */
            overflow: hidden; /* 溢出隐藏 */
            text-overflow: ellipsis; /* 省略号 */
            font-size: 0.85rem; /* 字体大小 */
        }

        .loading-overlay {
            position: absolute; /* 绝对定位 */
            top: 0; /* 顶部 */
            left: 0; /* 左侧 */
            right: 0; /* 右侧 */
            bottom: 0; /* 底部 */
            background-color: rgba(191, 219, 254, 0.4); /* 浅蓝半透明 */
            display: flex; /* 弹性布局 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            z-index: 10; /* 层级 */
            visibility: hidden; /* 隐藏 */
            backdrop-filter: blur(4px); /* 背景模糊 */
            transition: var(--transition); /* 过渡效果 */
            border-radius: 0; /* 随容器 */
        }

        body.dark-mode .loading-overlay {
            background-color: rgba(15, 36, 71, 0.6); /* 深色模式背景 */
        }

        .spinner {
            width: 50px; /* 宽度 */
            height: 50px; /* 高度 */
            border: 5px solid rgba(255, 255, 255, 0.35); /* 白色半透明边框 */
            border-radius: 50%; /* 圆形 */
            border-left-color: var(--primary-color); /* 蓝色左边框 */
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); /* 发光 */
            animation: spin 1s linear infinite; /* 旋转动画 */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 快捷回复区域 */
        .quick-replies {
            display: flex; /* 弹性布局 */
            flex-wrap: wrap; /* 换行 */
            gap: 0.5rem; /* 间距 */
            margin-top: 0.5rem; /* 上边距 */
        }

        .quick-reply-btn {
            padding: 0.3rem 0.85rem; /* 内边距 */
            background: rgba(255, 255, 255, 0.45); /* 玻璃背景 */
            border: 1px solid var(--glass-border); /* 高光边框 */
            border-radius: 20px; /* 胶囊圆角 */
            color: var(--primary-dark); /* 文本颜色 */
            cursor: pointer; /* 鼠标指针 */
            font-size: 0.85rem; /* 字体大小 */
            transition: var(--transition); /* 过渡效果 */
        }

        body.dark-mode .quick-reply-btn {
            background: rgba(30, 58, 95, 0.6); /* 深色玻璃 */
            color: #bfdbfe; /* 浅蓝文本 */
        }

        .quick-reply-btn:hover {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); /* 蓝色渐变 */
            color: white; /* 悬停颜色 */
            transform: translateY(-2px); /* 上移 */
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); /* 发光 */
        }

        /* 滚动条美化：蓝色圆角滚动条 */
        ::-webkit-scrollbar {
            width: 8px; /* 宽度 */
        }

        ::-webkit-scrollbar-track {
            background: transparent; /* 透明轨道 */
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.6); /* 蓝色滚动条 */
            border-radius: 4px; /* 圆角 */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.85); /* 悬停加深 */
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column; /* 垂直排列 */
            }

            .sidebar {
                width: 100%; /* 宽度100% */
                border-right: none; /* 无边框 */
                border-bottom: 1px solid var(--glass-border); /* 下边框 */
                max-height: 200px; /* 最大高度 */
            }

            .message-content {
                max-width: 90%; /* 最大宽度90% */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>传智教育EduRAG智慧问答系统</h1>
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <div class="container">
        <div class="chat-container">
            <div class="sidebar">
                <!-- 搜索框 -->
                <input type="text" class="search-box" id="searchBox" placeholder="搜索历史会话...">

                <!-- 会话控制按钮 -->
                <div class="session-controls">
                    <button class="new-session-btn" id="newSessionBtn">
                        <i class="fas fa-plus"></i> 新会话
                    </button>
                    <button class="clear-history-btn" id="clearHistoryBtn">
                        <i class="fas fa-trash"></i> 清除历史
                    </button>
                </div>
                <div class="history-title">
                    <i class="fas fa-history"></i> 历史会话
                </div>
                <div class="history-list" id="historyList">
                    <!-- 历史会话将动态添加到这里 -->
                </div>
                <div class="session-info" id="sessionInfo"></div>
            </div>

            <div class="main-content">
                <div class="chat-history" id="chatHistory">
                    <!-- 消息将动态添加到这里 -->
                    <div class="message system-message">
                        <div class="message-header">
                            <div class="avatar">智</div>
                            <span>智能助手</span>
                        </div>
                        <div class="message-content">
                            您好！我是智能问答助手，有什么我可以帮您的吗？
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="source-filter">
                        <label for="sourceFilter">学科类别：</label>
                        <select id="sourceFilter">
                            <option value="">全部</option>
                            <!-- 学科类别选项将动态添加 -->
                        </select>
                    </div>
                    <div class="input-group">
                        <textarea class="chat-input" id="chatInput" placeholder="请输入您的问题..."
                            rows="1" spellcheck="false"></textarea>
                        <button class="send-btn" id="sendBtn">
                            <i class="fas fa-paper-plane"></i> 发送
                        </button>
                    </div>
                    <!-- 快捷回复 -->
                    <div class="quick-replies" id="quickReplies">
                        <button class="quick-reply-btn">什么是人工智能？</button>
                        <button class="quick-reply-btn">机器学习有哪些算法？</button>
                        <button class="quick-reply-btn">如何学习Python？</button>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentSessionId = null; // 当前会话 ID
        let isResponseInProgress = false; // 是否正在处理响应
        let socket = null; // WebSocket 连接
        let isDarkMode = false; // 是否深色模式

        // DOM 元素
        const chatHistory = document.getElementById('chatHistory'); // 聊天历史容器
        const chatInput = document.getElementById('chatInput'); // 输入框
        const sendBtn = document.getElementById('sendBtn'); // 发送按钮
        const sourceFilter = document.getElementById('sourceFilter'); // 学科过滤器
        const historyList = document.getElementById('historyList'); // 历史列表
        const sessionInfo = document.getElementById('sessionInfo'); // 会话信息
        const newSessionBtn = document.getElementById('newSessionBtn'); // 新会话按钮
        const clearHistoryBtn = document.getElementById('clearHistoryBtn'); // 清除历史按钮
        const loadingOverlay = document.getElementById('loadingOverlay'); // 加载遮罩
        const themeToggle = document.getElementById('themeToggle'); // 主题切换按钮
        const searchBox = document.getElementById('searchBox'); // 搜索框
        const quickReplies = document.getElementById('quickReplies'); // 快捷回复
        const quickReplyBtns = quickReplies.querySelectorAll('.quick-reply-btn'); // 快捷回复按钮

        // API URL 前缀，根据部署环境调整
        const API_BASE_URL = ''; // 如果 API 和前端在同一域，可以留空

        // ============ 会话本地持久化（刷新后恢复会话与历史） ============

        // 读取本地存储的会话 ID 列表
        function getStoredSessions() {
            try {
                return JSON.parse(localStorage.getItem('chatSessions') || '[]');
            } catch (e) {
                return [];
            }
        }

        // 保存会话 ID 列表
        function setStoredSessions(sessions) {
            localStorage.setItem('chatSessions', JSON.stringify(sessions));
        }

        // 记录一个会话（去重），并标记为最近使用
        function storeSession(sessionId) {
            const sessions = getStoredSessions().filter(id => id !== sessionId);
            sessions.push(sessionId); // 最近使用的放最后
            setStoredSessions(sessions);
            localStorage.setItem('lastSessionId', sessionId);
        }

        // 从本地移除某个会话
        function removeStoredSession(sessionId) {
            setStoredSessions(getStoredSessions().filter(id => id !== sessionId));
            if (localStorage.getItem('lastSessionId') === sessionId) {
                localStorage.removeItem('lastSessionId');
            }
        }

        // ============ 页面初始化 ============

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', async () => {
            // 检查本地存储中的主题设置
            isDarkMode = localStorage.getItem('darkMode') === 'true';
            updateTheme();

            // 恢复上次的会话，避免刷新后新开对话导致历史丢失
            const lastSessionId = localStorage.getItem('lastSessionId');
            if (lastSessionId) {
                currentSessionId = lastSessionId;
                sessionInfo.textContent = `会话ID: ${currentSessionId.slice(0, 8)}...`;
                // 恢复该会话的聊天记录到对话窗口
                await restoreSessionMessages(currentSessionId);
                await loadSessionList();
            } else {
                // 没有历史会话才创建新会话
                await createNewSession();
            }

            // 加载学科类别
            await loadSources();

            // 事件监听器
            sendBtn.addEventListener('click', sendMessage); // 发送按钮点击事件
            chatInput.addEventListener('keydown', (e) => { // 输入框键盘事件
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            // 输入框自适应高度（上限 150px）
            chatInput.addEventListener('input', () => {
                chatInput.style.height = '45px';
                chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
            });

            newSessionBtn.addEventListener('click', createNewSession); // 新会话按钮点击事件
            clearHistoryBtn.addEventListener('click', clearHistory); // 清除历史按钮点击事件
            themeToggle.addEventListener('click', toggleTheme); // 主题切换按钮点击事件
            searchBox.addEventListener('input', searchHistory); // 搜索框输入事件

            // 快捷回复按钮点击事件
            quickReplyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    chatInput.value = btn.textContent;
                    chatInput.style.height = '45px';
                    sendMessage();
                });
            });
        });

        // 切换主题
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
            updateTheme();
        }

        // 更新主题
        function updateTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        // 搜索历史会话
        function searchHistory() {
            const searchTerm = searchBox.value.toLowerCase();
            const historyItems = historyList.querySelectorAll('.history-item');

            historyItems.forEach(item => {
                const question = item.querySelector('.history-question').textContent.toLowerCase();
                const answer = item.querySelector('.history-answer').textContent.toLowerCase();

                if (question.includes(searchTerm) || answer.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // 创建新会话
        async function createNewSession() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/api/create_session`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error('创建会话失败');
                }

                const data = await response.json();
                currentSessionId = data.session_id; // 更新当前会话 ID

                // 保存到本地，刷新后可恢复
                storeSession(currentSessionId);

                // 更新会话信息
                sessionInfo.textContent = `会话ID: ${currentSessionId.slice(0, 8)}...`;

                // 清空聊天历史并显示欢迎语
                clearChatHistory();

                // 刷新侧边栏会话列表
                await loadSessionList();

            } catch (error) {
                console.error('创建会话错误:', error);
                alert('创建会话失败，请刷新页面重试');
            } finally {
                hideLoading();
            }
        }

        // 加载学科类别
        async function loadSources() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/sources`);

                if (!response.ok) {
                    throw new Error('获取学科类别失败');
                }

                const data = await response.json();

                // 清空现有选项
                sourceFilter.innerHTML = '<option value="">全部</option>';

                // 添加学科类别选项
                data.sources.forEach(source => {
                    const option = document.createElement('option');
                    option.value = source;
                    option.textContent = source;
                    sourceFilter.appendChild(option);
                });

            } catch (error) {
                console.error('加载学科类别错误:', error);
            }
        }

        // 渲染侧边栏会话列表（列出本地保存的所有会话）
        async function loadSessionList() {
            // 清空历史列表
            historyList.innerHTML = '';

            const sessions = getStoredSessions();

            for (const sessionId of sessions) {
                // 查询该会话的对话轮数
                let rounds = 0;
                try {
                    const response = await fetch(`${API_BASE_URL}/api/history/${sessionId}`);
                    if (response.ok) {
                        const data = await response.json();
                        rounds = data.history.length;
                    }
                } catch (error) {
                    console.error(`获取会话 ${sessionId} 历史失败:`, error);
                }

                const sessionItem = document.createElement('div');
                sessionItem.className = 'history-item' + (sessionId === currentSessionId ? ' active' : '');
                sessionItem.dataset.sessionId = sessionId;
                sessionItem.innerHTML = `
                    <div class="history-question">会话 ${sessionId.slice(0, 8)}...</div>
                    <div class="history-answer">共 ${rounds} 轮对话</div>
                `;

                // 点击历史记录项，切换到该会话并显示整个会话
                sessionItem.addEventListener('click', () => switchSession(sessionId));

                historyList.appendChild(sessionItem);
            }
        }

        // 切换到某个会话：更新当前会话 ID 并在对话窗口还原历史
        async function switchSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('lastSessionId', sessionId); // 记住最近使用
            sessionInfo.textContent = `会话ID: ${sessionId.slice(0, 8)}...`;

            await restoreSessionMessages(sessionId);
            await loadSessionList(); // 刷新高亮
        }

        // 从后端拉取会话历史并渲染到对话窗口
        async function restoreSessionMessages(sessionId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${sessionId}`);

                if (!response.ok) {
                    throw new Error('获取历史记录失败');
                }

                const data = await response.json();

                // 清空聊天窗口
                chatHistory.innerHTML = '';

                if (data.history.length === 0) {
                    // 空会话显示欢迎语
                    showWelcomeMessage();
                } else {
                    // 添加整个会话的 QA 对
                    data.history.forEach(item => {
                        addMessage('user', item.question); // 添加用户问题
                        addMessage('system', item.answer); // 添加系统回答
                    });
                    scrollToBottom();
                }

            } catch (error) {
                console.error('恢复会话历史错误:', error);
                showWelcomeMessage();
            }
        }

        // 显示欢迎消息
        function showWelcomeMessage() {
            chatHistory.innerHTML = `
                <div class="message system-message">
                    <div class="message-header">
                        <div class="avatar">智</div>
                        <span>智能助手</span>
                    </div>
                    <div class="message-content">
                        您好！我是智能问答助手，有什么我可以帮您的吗？
                    </div>
                </div>
            `;
        }

        // 清除历史记录
        async function clearHistory() {
            if (!currentSessionId) return;

            if (!confirm('确定要清除所有历史记录吗？')) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${currentSessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('清除历史记录失败');
                }

                // 清空聊天历史并提示
                chatHistory.innerHTML = `
                    <div class="message system-message">
                        <div class="message-header">
                            <div class="avatar">智</div>
                            <span>智能助手</span>
                        </div>
                        <div class="message-content">
                            历史记录已清除，有什么我可以帮您的吗？
                        </div>
                    </div>
                `;

                // 刷新侧边栏轮数显示
                await loadSessionList();

            } catch (error) {
                console.error('清除历史记录错误:', error);
                alert('清除历史记录失败');
            } finally {
                hideLoading();
            }
        }

        // 清空聊天历史（显示欢迎语）
        function clearChatHistory() {
            showWelcomeMessage();
        }

        // 显示加载遮罩
        function showLoading() {
            loadingOverlay.style.visibility = 'visible';
        }

        // 隐藏加载遮罩
        function hideLoading() {
            loadingOverlay.style.visibility = 'hidden';
        }

        // 发送消息
        async function sendMessage() {
            const query = chatInput.value.trim();
            const filter = sourceFilter.value;

            if (!query || isResponseInProgress) return;

            // 重置输入框
            chatInput.value = '';
            chatInput.style.height = '45px';

            // 添加用户消息到聊天窗口
            addMessage('user', query);

            // 设置正在响应标志
            isResponseInProgress = true;

            // 添加正在输入指示器
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            chatHistory.appendChild(typingIndicator);

            // 滚动到底部
            scrollToBottom();

            try {
                // 发送查询请求
                const response = await fetch(`${API_BASE_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    })
                });

                if (!response.ok) {
                    throw new Error('查询失败');
                }

                const data = await response.json();

                // 移除输入指示器
                if (typingIndicator.parentNode) {
                    chatHistory.removeChild(typingIndicator);
                }

                // 如果需要流式输出，使用 WebSocket
                if (data.is_streaming) {
                    // 创建系统消息容器，但内容为空
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message system-message';

                    const headerElement = document.createElement('div');
                    headerElement.className = 'message-header';
                    headerElement.innerHTML = `
                        <div class="avatar">智</div>
                        <span>智能助手</span>
                    `;

                    const contentElement = document.createElement('div');
                    contentElement.className = 'message-content';
                    contentElement.innerHTML = ''; // 初始化为空

                    messageElement.appendChild(headerElement);
                    messageElement.appendChild(contentElement);
                    chatHistory.appendChild(messageElement);

                    // 建立 WebSocket 连接进行流式输出
                    await handleStreamingResponse(query, filter, contentElement);
                } else {
                    // 直接添加格式化后的答案
                    addMessage('system', data.answer);
                }

                // 重新加载侧边栏会话列表（更新轮数）
                await loadSessionList();

            } catch (error) {
                console.error('发送消息错误:', error);

                // 移除输入指示器
                if (typingIndicator.parentNode) {
                    chatHistory.removeChild(typingIndicator);
                }

                // 添加错误消息
                addMessage('system', `抱歉，发生错误: ${error.message}`);
            } finally {
                // 清除正在响应标志
                isResponseInProgress = false;

                // 滚动到底部
                scrollToBottom();
            }
        }

        // 处理流式响应
        async function handleStreamingResponse(query, filter, contentElement) {
            // 关闭现有连接
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }

            return new Promise((resolve, reject) => {
                // WebSocket URL
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}${API_BASE_URL}/api/stream`;

                // 创建 WebSocket 连接
                socket = new WebSocket(wsUrl);

                let accumulatedContent = ''; // 累积流式内容

                // 连接建立时
                socket.onopen = function() {
                    console.log('WebSocket 连接已建立');

                    // 发送查询请求
                    socket.send(JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    }));
                };

                // 接收消息时
                socket.onmessage = function(event) {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'start':
                            console.log('流式响应开始');
                            break;

                        case 'token':
                            // 追加 token 到内容
                            accumulatedContent += data.token;
                            // 使用 marked.js 解析 Markdown 格式
                            contentElement.innerHTML = marked.parse(accumulatedContent);
                            scrollToBottom();
                            break;

                        case 'end':
                            console.log('流式响应结束');
                            socket.close();
                            resolve();
                            break;

                        case 'error':
                            console.error('流式响应错误:', data.error);
                            contentElement.innerHTML += `<p>[错误: ${data.error}]</p>`;
                            socket.close();
                            reject(new Error(data.error));
                            break;
                    }
                };

                // 发生错误时
                socket.onerror = function(error) {
                    console.error('WebSocket 错误:', error);
                    contentElement.innerHTML += '<p>[连接错误]</p>';
                    reject(error);
                };

                // 连接关闭时
                socket.onclose = function() {
                    console.log('WebSocket 连接已关闭');
                    resolve();
                };
            });
        }

        // 添加消息到聊天窗口（支持 Markdown 格式）
        function addMessage(type, content) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type === 'user' ? 'user-message' : 'system-message'}`;

            // 添加消息头部
            const headerElement = document.createElement('div');
            headerElement.className = 'message-header';

            if (type === 'user') {
                headerElement.innerHTML = `
                    <div class="avatar">用</div>
                    <span>我</span>
                `;
            } else {
                headerElement.innerHTML = `
                    <div class="avatar">智</div>
                    <span>智能助手</span>
                `;
            }

            const contentElement = document.createElement('div');
            contentElement.className = 'message-content';
            // 使用 marked.js 解析 Markdown 格式（支持换行和代码块）
            contentElement.innerHTML = marked.parse(content);

            messageElement.appendChild(headerElement);
            messageElement.appendChild(contentElement);
            chatHistory.appendChild(messageElement);

            // 滚动到底部
            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
